version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - chatly-network
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - chatly-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: dotnet-backend
    restart: unless-stopped
    volumes:
      - ./Backend:/app
      - profile_picture:/www/user-profile-picture
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=MyAppDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - ASPNETCORE_URLS=http://+:5000
      - Storage__UserProfilePicturesPath=/www/user-profile-picture

      # Add redis environment variables
      - ConnectionStrings__RedisConnection=redis:6379
      # - ConnectionStrings__Redis__Instance=0

    ports:
      - "5000:5000"
    depends_on:
      - sqlserver
      - redis
    networks:
      - chatly-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: react-frontend
    restart: unless-stopped
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_PORT=3000
      - VITE_API_URL=https://chatlyapi.chiragbimali.dev
      - VITE_API_URL=https://chatlyapi.chiragbimali.com.np
      - VITE_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - chatly-network

volumes:
  sql_data:
  frontend_node_modules:
  profile_picture:

networks:
  chatly-network:
