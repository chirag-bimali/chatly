version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - chatly-network
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - chatly-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: dotnet-backend
    restart: unless-stopped
    volumes:
      - profile_picture:/www/user-profile-picture
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=MyAppDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - ASPNETCORE_URLS=http://+:5000
      - Storage__UserProfilePicturesPath=/www/user-profile-picture
      - ConnectionStrings__RedisConnection=redis:6379

    ports:
      - "5000:5000"
    depends_on:
      - sqlserver
      - redis
    networks:
      - chatly-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_PORT=3000
        - VITE_API_URL=https://chatlyapi.chiragbimali.dev
        - VITE_API_URL=https://chatlyapi.chiragbimali.com.np
    container_name: react-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - chatly-network

volumes:
  sql_data:
  profile_picture:

networks:
  chatly-network:
